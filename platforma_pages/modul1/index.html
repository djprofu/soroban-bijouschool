<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modul 1</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('../imagini/fundal_japonia.jpg'); /* înlocuiește cu imaginea ta */
      background-size: cover;
      background-position: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow-x: hidden;
    }

    .overlay {
      background: rgba(255, 255, 255, 0.85);
      width: 100%;
      height: 100%;
      padding: 40px 20px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      color: #4b0082;
      font-size: 48px;
      margin-bottom: 40px;
    }

    .tab-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
    }

    .tab-buttons button {
      font-size: 24px;
      padding: 20px 40px;
      background-color: #eee;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .tab-buttons button:hover {
      background-color: #d1c4e9;
      transform: scale(1.05);
    }

    .tab-buttons button:active {
      transform: scale(0.98);
    }

    .tab-buttons button span {
      margin-right: 10px;
      font-size: 28px;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <h1>📘 Modul 1</h1>
    <div class="tab-buttons">
      <button onclick="selectTab('antrenament')"><span>✅</span> Mă antrenez</button>
      <button onclick="selectTab('curs')"><span>📚</span> La curs</button>
    </div>
  </div>

  <script>
    function selectTab(tab) {
      if (tab === 'antrenament') {
        window.location.href = 'exercitiu_usor.html';
      } else if (tab === 'curs') {
        window.location.href = 'curs.html';
      }
    }
  </script>

</body>
</html>
